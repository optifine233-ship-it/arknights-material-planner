const RARITY_LABEL = {5:'六星 ★★★★★★', 4:'五星 ★★★★★', 3:'四星 ★★★★', 2:'三星 ★★★'};
const RARITY_CLS = {5:'r6', 4:'r5', 3:'r4', 2:'r3'};
const PROF_ORDER = ['近卫','狙击','术师','医疗','重装','辅助','特种','先锋'];

// group ops
function buildGroups(ops) {
  const g = {};
  ops.forEach(function(op) {
    if (!g[op.rarity]) g[op.rarity] = {};
    if (!g[op.rarity][op.profession]) g[op.rarity][op.profession] = [];
    g[op.rarity][op.profession].push(op.name);
  });
  return g;
}

function render() {
  const groups = buildGroups(OPS);
  const tbl = document.getElementById('t');
  let html = '';
  [5,4,3,2].forEach(function(r) {
    if (!groups[r]) return;
    const total = Object.values(groups[r]).reduce(function(s,a){return s+a.length;}, 0);
    const rc = RARITY_CLS[r];
    html += '<tr class="rh ' + rc + '"><td colspan="3"><button class="tb" onclick="tog(' + r + ')">▼</button> '
          + RARITY_LABEL[r] + ' <span class="cnt">(' + total + '人)</span>'
          + ' <button class="sb" onclick="selR(' + r + ',true)">全选</button>'
          + ' <button class="sb" onclick="selR(' + r + ',false)">全不选</button></td></tr>';
    PROF_ORDER.forEach(function(prof) {
      if (!groups[r][prof]) return;
      const names = groups[r][prof];
      html += '<tr class="ph g' + r + '"><td colspan="3" class="pl">' + prof + ' (' + names.length + ')</td></tr>';
      for (let i = 0; i < names.length; i += 3) {
        html += '<tr class="g' + r + '">';
        for (let j = 0; j < 3; j++) {
          const name = names[i+j];
          if (!name) { html += '<td></td>'; continue; }
          const safe = name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
          html += '<td><label><input type="checkbox" class="op r' + r + '" data-n="' + safe + '"> ' + safe + '</label></td>';
        }
        html += '</tr>';
      }
    });
  });
  tbl.innerHTML = html;
  tbl.addEventListener('change', upd);
}

const col = {};
function upd() {
  document.getElementById('sc').textContent = document.querySelectorAll('.op:checked').length;
}
function selR(r, v) {
  document.querySelectorAll('.r' + r).forEach(function(c){ c.checked = v; });
  upd();
}
function tog(r) {
  col[r] = !col[r];
  document.querySelectorAll('.g' + r).forEach(function(tr){ tr.style.display = col[r] ? 'none' : ''; });
  const rc = RARITY_CLS[r];
  const btn = document.querySelector('.' + rc + ' .tb');
  if (btn) btn.textContent = col[r] ? '▶' : '▼';
}
function togAll(v) {
  [5,4,3,2].forEach(function(r){ if (v && col[r]) tog(r); if (!v && !col[r]) tog(r); });
}
function clrAll() {
  document.querySelectorAll('.op').forEach(function(c){ c.checked = false; });
  upd();
}
function exp() {
  const sel = Array.from(document.querySelectorAll('.op:checked')).map(function(c){ return c.dataset.n; });
  const rb = document.getElementById('rb');
  rb.style.display = 'block';
  if (!sel.length) { rb.innerHTML = '<b>请先勾选干员</b>'; return; }
  rb.innerHTML = '<b>已选 ' + sel.length + ' 个干员（复制下方内容发给我）：</b><br>' + sel.join(',');
  rb.scrollIntoView({behavior:'smooth'});
}
function flt(q) {
  const trs = document.querySelectorAll('#t tr');
  if (!q) {
    trs.forEach(function(tr){ tr.style.display = ''; });
    [5,4,3,2].forEach(function(r){ if (col[r]) document.querySelectorAll('.g'+r).forEach(function(tr){ tr.style.display='none'; }); });
    return;
  }
  q = q.toLowerCase();
  trs.forEach(function(tr) {
    if (tr.classList.contains('rh') || tr.classList.contains('ph')) { tr.style.display = ''; return; }
    const ok = Array.from(tr.querySelectorAll('label')).some(function(l){ return l.textContent.toLowerCase().includes(q); });
    tr.style.display = ok ? '' : 'none';
  });
}
