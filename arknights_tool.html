<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>明日方舟 培养材料统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei',sans-serif;font-size:13px;background:#111827;color:#e5e7eb;min-height:100vh}
.tabs{display:flex;background:#1f2937;border-bottom:2px solid #374151;padding:0 12px}
.tab{padding:10px 18px;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:13px;user-select:none}
.tab.active{color:#e6a817;border-bottom-color:#e6a817}
.tab:hover{color:#d1d5db}
.panel{display:none;padding:12px}
.panel.active{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;padding:8px 10px;background:#1f2937;border-radius:6px}
.toolbar h3{font-size:13px;color:#e6a817;margin-right:4px;white-space:nowrap}
input[type=text]{background:#374151;border:1px solid #4b5563;color:#e5e7eb;padding:4px 8px;border-radius:4px;font-size:12px}
input[type=text]:focus{outline:1px solid #6b7280}
.btn{background:#374151;border:1px solid #4b5563;color:#d1d5db;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{background:#4b5563}
.btn-g{background:#14532d;border-color:#166534;color:#86efac}
.btn-g:hover{background:#166534}
.btn-r{background:#7f1d1d;border-color:#991b1b;color:#fca5a5}
.btn-r:hover{background:#991b1b}
.op-section{margin-bottom:3px}
.sec-hdr{background:#1f2937;padding:4px 10px;font-size:12px;color:#9ca3af;display:flex;gap:8px;align-items:center;cursor:pointer;border-radius:4px;user-select:none}
.sec-hdr:hover{background:#374151}
.op-table{width:100%;border-collapse:collapse;table-layout:fixed}
.op-table th{background:#1f2937;padding:3px 6px;font-size:11px;color:#6b7280;text-align:left;border-bottom:1px solid #374151;white-space:nowrap}
.op-table td{padding:2px 4px;border-bottom:1px solid #1f2937;vertical-align:middle}
.op-table tr:hover td{background:#1f2937}
.op-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;width:72px;max-width:72px}
.col-name{width:76px}
.col-elite{width:180px}
.col-slv{width:80px}
.lv-plan{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;padding-right:10px}
.lv-sel{background:#374151;border:1px solid #4b5563;color:#e5e7eb;padding:1px 2px;border-radius:3px;font-size:11px;cursor:pointer;max-width:46px}
.lv-inp{background:#374151;border:1px solid #4b5563;color:#e5e7eb;width:34px;padding:1px 3px;border-radius:3px;font-size:11px;text-align:right;-moz-appearance:textfield}
.lv-inp::-webkit-outer-spin-button,.lv-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lv-arrow{color:#6b7280;font-size:11px;padding:0 1px}
.lv-sum{font-size:11px;color:#6b7280;white-space:nowrap}
.col-ms{width:auto}
.col-md{width:auto}
.r5{color:#e6a817}.r4{color:#c084fc}.r3{color:#60a5fa}.r2{color:#6ee7b7}
.cb-group{display:flex;flex-wrap:wrap;gap:2px}
.cb-lbl{display:inline-flex;align-items:center;gap:2px;border-radius:3px;padding:1px 5px;white-space:nowrap;font-size:11px;cursor:pointer;border:1px solid transparent}
.cb-lbl:hover{border-color:#4b5563}
.cb-lbl input{cursor:pointer;width:12px;height:12px}
.cb-e .cb-lbl{color:#93c5fd}
.cb-s .cb-lbl{color:#6ee7b7}
.cb-m .cb-lbl{color:#fbbf24}
.cb-md .cb-lbl{color:#d8b4fe}
/* inventory */
.inv-section{margin-bottom:14px}
.inv-title{font-size:13px;font-weight:bold;padding:5px 10px;margin-bottom:6px;border-radius:4px;display:flex;align-items:center;gap:8px}
.inv-title.blue{background:#1e3a5f;color:#93c5fd}
.inv-title.purple{background:#3b1f5e;color:#d8b4fe}
.inv-title.gold{background:#3d2b00;color:#fcd34d}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:3px}
.inv-item{display:flex;align-items:center;gap:6px;padding:3px 8px;background:#1f2937;border-radius:4px}
.inv-item label{flex:1;font-size:12px;color:#d1d5db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.inv-item input[type=number]{width:62px;background:#374151;border:1px solid #4b5563;color:#e5e7eb;padding:2px 4px;border-radius:3px;font-size:12px;text-align:right;-moz-appearance:textfield}
.inv-item input[type=number]::-webkit-outer-spin-button,.inv-item input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inv-item input[type=number]:focus{outline:1px solid #6b7280}
/* result */
.result-wrap{overflow-x:auto}
.result-table{width:100%;border-collapse:collapse}
.result-table th{background:#1f2937;padding:5px 12px;font-size:12px;color:#6b7280;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:1}
.result-table td{padding:4px 12px;border-bottom:1px solid #1f2937;font-size:12px}
.result-table tr:hover td{background:#1f2937}
.deficit{color:#f87171;font-weight:bold}
.ok{color:#4ade80}
.mat-blue{color:#93c5fd}.mat-purple{color:#d8b4fe}.mat-gold{color:#fcd34d}
.blue-eq-box{background:#1f2937;border-radius:6px;padding:12px;margin-top:12px}
.blue-eq-box h4{font-size:13px;color:#60a5fa;margin-bottom:6px}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.eq-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-radius:4px;font-size:12px;background:#283548;border:1px solid #374151}
.eq-row:hover{background:#2f3f52}
.stat-bar{display:flex;gap:16px;padding:8px 12px;background:#1f2937;border-radius:6px;margin-bottom:8px;font-size:12px;color:#9ca3af;flex-wrap:wrap}
.stat-bar b{color:#e5e7eb}
</style>
</head><body>

<div class="tabs">
  <div class="tab active" onclick="switchTab('plan')">培养计划</div>
  <div class="tab" onclick="switchTab('inv')">材料库存</div>
  <div class="tab" onclick="switchTab('result')">缺口统计</div>
</div>

<div id="tab-plan" class="panel active">
  <div class="toolbar">
    <h3>培养计划</h3>
    <input type="text" id="op-search" placeholder="搜索干员..." oninput="filterOps(this.value)" style="width:130px">
    <button class="btn btn-g" onclick="quickAll('e1max')">精1满级</button>
    <button class="btn btn-g" onclick="quickAll('e2max')">精2满级</button>
    <button class="btn btn-g" onclick="quickAll('slv')">全技能7</button>
    <button class="btn btn-g" onclick="quickAll('ms3')">全专3</button>
    <button class="btn btn-g" onclick="quickAll('md3')">全模组3</button>
    <button class="btn btn-r" onclick="clearAll()">清除全部</button>
  </div>
  <div id="ops-list"></div>
</div>

<div id="tab-inv" class="panel">
  <div class="toolbar">
    <h3>材料库存</h3>
    <button class="btn btn-g" onclick="saveInv()">保存</button>
    <button class="btn" onclick="loadInv()">重新加载</button>
    <button class="btn btn-r" onclick="clearInv()">清零</button>
    <span style="color:#6b7280;font-size:11px" id="inv-status"></span>
  </div>
  <div id="inv-content"></div>
</div>

<div id="tab-result" class="panel">
  <div class="toolbar">
    <h3>缺口统计</h3>
    <button class="btn btn-g" onclick="calcResult()">立即计算</button>
    <label style="font-size:12px;color:#9ca3af;display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="show-zero" onchange="calcResult()"> 显示已足量材料
    </label>
    <label style="font-size:12px;color:#9ca3af;display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="hide-chips" onchange="calcResult()"> 隐藏芯片
    </label>
    <span style="margin-left:8px;color:#4b5563">|</span>
    <input type="text" id="src-mat" placeholder="材料名称..." style="width:140px" oninput="calcSource(this.value)">
    <span style="font-size:11px;color:#6b7280">输入材料名查看来源</span>
  </div>
  <div id="source-content" style="display:none;margin-bottom:8px;padding:8px 10px;background:#1f2937;border-radius:6px;font-size:12px"></div>
  <div id="result-content">
    <p style="color:#6b7280;padding:40px;text-align:center">点击「立即计算」查看材料缺口</p>
  </div>
</div>

function safeId(name, type) {
  return 'ck_' + name.replace(/[^一-龥a-zA-Z0-9]/g,'') + '_' + type.replace(/[^a-zA-Z0-9]/g,'_');
}

function makeCb(opName, type, label, kind) {

  return '<span class="' + (CB_CLS[kind]||'') + '"><label class="cb-lbl" title="' + label + '"><input type="checkbox" id="' + id + '" data-op="' + opName + '" data-type="' + type + '"> ' + label + '</label></span>';

// ---- Level plan state ----
const lvPlan = {};

function buildLvSel(name, r) {
  const mx = MAX_LV[r] || {};
  const maxE = mx.e2 ? 2 : (mx.e1 ? 1 : 0);
  let eopts = '';
  for(let e=0; e<=maxE; e++) eopts += '<option value="'+e+'">精'+e+'</option>';
  const maxE0 = mx.e0 || 1;
  return '<div class="lv-plan" data-op="'+name+'">'
    + '<select class="lv-sel" data-op="'+name+'" data-f="fe" onchange="updateLvPlan(this)">'+eopts+'</select>'
    + '<input class="lv-inp" type="number" min="1" max="'+maxE0+'" data-op="'+name+'" data-f="fl" value="1" onchange="updateLvPlan(this)">'
    + '<span class="lv-arrow">→</span>'
    + '<select class="lv-sel" data-op="'+name+'" data-f="te" onchange="updateLvPlan(this)">'+eopts+'</select>'
    + '<input class="lv-inp" type="number" min="1" max="'+maxE0+'" data-op="'+name+'" data-f="tl" value="1" onchange="updateLvPlan(this)">'
    + '</div>';
}

function updateLvPlan(el) {
  const opName = el.dataset.op;
  const div = el.closest('.lv-plan');
  if(!div) return;
  const op = OPS[opName]; if(!op) return;
  const mx = MAX_LV[op.r]||{};
  const feEl = div.querySelector('[data-f="fe"]');
  const flEl = div.querySelector('[data-f="fl"]');
  const teEl = div.querySelector('[data-f="te"]');
  const tlEl = div.querySelector('[data-f="tl"]');
  const fe = parseInt(feEl.value)||0;
  const te = parseInt(teEl.value)||0;
  const maxFl = mx['e'+fe]||1;
  const maxTl = mx['e'+te]||1;
  flEl.max = maxFl; if((parseInt(flEl.value)||1)>maxFl) flEl.value=maxFl;
  tlEl.max = maxTl; if((parseInt(tlEl.value)||1)>maxTl) tlEl.value=maxTl;
  lvPlan[opName] = {fe, fl:Math.min(parseInt(flEl.value)||1,maxFl), te, tl:Math.min(parseInt(tlEl.value)||1,maxTl)};
  savePlan();
}

function setLvPlan(opName, fe, fl, te, tl) {
  lvPlan[opName] = {fe,fl,te,tl};
  const div = document.querySelector('.lv-plan[data-op="'+opName+'"]');
  if(!div) return;
  const op = OPS[opName]; if(!op) return;
  const mx = MAX_LV[op.r]||{};
  div.querySelector('[data-f="fe"]').value = fe;
  div.querySelector('[data-f="te"]').value = te;
  const flEl = div.querySelector('[data-f="fl"]');
  const tlEl = div.querySelector('[data-f="tl"]');
  flEl.max = mx['e'+fe]||1; flEl.value = fl;
  tlEl.max = mx['e'+te]||1; tlEl.value = tl;
}

// ---- Leveling cost ----
function calcLvCost(r, fe, fl, te, tl) {
  const mx = MAX_LV[r]||{};
  let exp=0, lmd=0;
  function rangeSum(ei, fromLv, toLv) {
    if(fromLv>=toLv) return;
    const arr = LEVEL_COSTS['e'+ei];
    if(!arr) return;
    for(let lv=fromLv; lv<toLv; lv++) {
      const entry = arr[lv-1]; if(entry){exp+=entry.exp; lmd+=entry.lmd;}
    }
  }
  if(fe===te) { rangeSum(fe,fl,tl); return {exp,lmd}; }
  if(fe>te) return {exp,lmd};
  rangeSum(fe, fl, mx['e'+fe]||fl);
  for(let e=fe+1; e<=te; e++) {
    lmd += (ELITE_LMD[r]||{})['e'+e]||0;
    if(e<te) rangeSum(e, 1, mx['e'+e]||1);
    else rangeSum(e, 1, tl);
  }
  return {exp,lmd};
}

function fmtNum(n) {
  if(n>=100000000) return (n/100000000).toFixed(1)+'亿';
  if(n>=10000) return (n/10000).toFixed(1)+'万';
  return n.toString();
}

function buildOpRow(name) {
  const op = OPS[name]; if(!op) return '';
  const rc = RAR_CLS[op.r] || '';
  const elite = buildLvSel(name, op.r);
  const hasSlv = (op.sl||[]).some(s=>s.mats&&s.mats.length);
  const slv = hasSlv ? makeCb(name,'slv','技2-7','s') : '';
  let ms = '';
  ['s1','s2','s3'].forEach((sk,si) => {
    const stages = (op.ms&&op.ms[sk]) || [];
    stages.forEach(st => {
      ms += makeCb(name,'ms-'+sk+'-'+st.stage,'S'+(si+1)+'专'+st.stage,'m');
    });
  });
  let md = '';
  (op.md||[]).forEach((mod,mi) => {
    const short = mod.name.length>4 ? mod.name.slice(0,4) : mod.name;
    mod.stages.forEach(st => {
      md += makeCb(name,'md-'+mi+'-'+st.stage,short+st.stage,'md');
    });
  });
  return '<tr class="op-row" data-name="'+name+'"><td class="op-name '+rc+'" title="'+name+'">'+name+'</td>'
    +'<td>'+elite+'</td>'
    +'<td><div class="cb-group">'+slv+'</div></td>'
    +'<td><div class="cb-group">'+ms+'</div></td>'
    +'<td><div class="cb-group">'+md+'</div></td></tr>';
}

function buildSection(r, names) {
  const rc = RAR_CLS[r]||'';
  const lbl = RAR_LABEL[r]||'';
  let rows = names.map(n=>buildOpRow(n)).join('');
  function rbtn(mode, label) {
    return '<button class="btn" style="font-size:11px;padding:1px 7px" data-r="'+r+'" data-m="'+mode+'" onclick="event.stopPropagation();batchBtn(this)">'+label+'</button>';
  }
  return '<div class="op-section" id="sec-'+r+'">'
    +'<div class="sec-hdr" onclick="toggleSec('+r+')">'
    +'<span id="sec-tog-'+r+'">▼</span>'
    +'<span class="'+rc+'">'+lbl+' ('+names.length+')</span>'
    +rbtn('e2','全精2')+rbtn('slv','全技7')+rbtn('ms3','全专3')+rbtn('full','全满')
    +'</div>'
    +'<table class="op-table" id="sec-tbl-'+r+'">'
    +'<thead><tr><th class="col-name">干员</th><th class="col-elite">精英化/等级</th><th class="col-slv">技能</th><th class="col-ms">专精</th><th class="col-md">模组</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}

function renderOps() {
  const groups = {};
  OPS_ORDER.forEach(n => {
    const op = OPS[n]; if(!op) return;
    if(!groups[op.r]) groups[op.r]=[];
    groups[op.r].push(n);
  });
  document.getElementById('ops-list').innerHTML = [5,4,3,2].filter(r=>groups[r]).map(r=>buildSection(r,groups[r])).join('');

// Batch selection helpers
function getKeys(opName, mode) {
  const op = OPS[opName]; if(!op) return [];
  const keys = [];
  const add = type => keys.push(safeId(opName, type));
  if(mode==='slv'||mode==='full') {
    if((op.sl||[]).some(s=>s.mats&&s.mats.length)) add('slv');
  }
  if(mode==='ms3'||mode==='full') {
    ['s1','s2','s3'].forEach(sk => (op.ms&&op.ms[sk]||[]).forEach(st=>add('ms-'+sk+'-'+st.stage)));
  }
  if(mode==='md3'||mode==='full') {
    (op.md||[]).forEach((mod,mi) => mod.stages.forEach(st=>add('md-'+mi+'-'+st.stage)));
  }
  return keys;
}

function quickAll(mode) {
  if(mode==='e1max'||mode==='e2max') {
    const targetE = mode==='e1max' ? 1 : 2;
    OPS_ORDER.forEach(opName => {
      const op = OPS[opName]; if(!op) return;
      const mx = MAX_LV[op.r]||{};
      if(!mx['e'+targetE]) return;
      setLvPlan(opName, 0, 1, targetE, mx['e'+targetE]);
    });
    savePlan();
    return;
  }
  OPS_ORDER.forEach(n => getKeys(n,mode).forEach(id => { const el=document.getElementById(id); if(el) el.checked=true; }));
  savePlan();
}

function batchRarity(r, mode) {
  OPS_ORDER.forEach(n => {
    const op = OPS[n]; if(!op||op.r!==r) return;
    if(mode==='e2') {
      const mx = MAX_LV[r]||{};
      if(mx.e2) setLvPlan(n, 0, 1, 2, mx.e2);
    } else {
      getKeys(n,mode).forEach(id => { const el=document.getElementById(id); if(el) el.checked=true; });
    }
  });
  savePlan();
}

function batchBtn(el) {
  batchRarity(parseInt(el.dataset.r), el.dataset.m);
}

function clearAll() {
  document.querySelectorAll('#ops-list input[type=checkbox]').forEach(cb => cb.checked=false);
  OPS_ORDER.forEach(opName => {
    delete lvPlan[opName];
    const op = OPS[opName]; if(!op) return;
    const div = document.querySelector('.lv-plan[data-op="'+opName+'"]');
    if(!div) return;
    const mx = MAX_LV[op.r]||{};
    div.querySelector('[data-f="fe"]').value = 0;
    div.querySelector('[data-f="te"]').value = 0;
    const flEl = div.querySelector('[data-f="fl"]');
    const tlEl = div.querySelector('[data-f="tl"]');
    flEl.max = mx.e0||1; flEl.value = 1;
    tlEl.max = mx.e0||1; tlEl.value = 1;
  });
  savePlan();
}

// ---- Needs calculation ----
function calcNeeds() {
  const needs = {};
  const add = mats => (mats||[]).forEach(m => { needs[m.name]=(needs[m.name]||0)+m.qty; });
  // E1/E2 promotion materials from level plan
  OPS_ORDER.forEach(opName => {
    const op = OPS[opName]; if(!op) return;
    const plan = lvPlan[opName]; if(!plan) return;
    const {fe, te} = plan;
    if(fe<=0 && te>=1 && op.e1 && op.e1.length) add(op.e1);
    if(fe<=1 && te>=2 && op.e2 && op.e2.length) add(op.e2);
  });
  // Skill/mastery/module materials from checkboxes
  document.querySelectorAll('#ops-list input[type=checkbox]:checked').forEach(cb => {
    const opName=cb.dataset.op, type=cb.dataset.type;
    const op=OPS[opName]; if(!op) return;
    if(type==='slv') (op.sl||[]).forEach(s=>add(s.mats));
    else if(type.startsWith('ms-')) {
      const [,sk,st]=type.split('-');
      const stg=(op.ms&&op.ms[sk]||[]).find(s=>s.stage===parseInt(st));
      if(stg) add(stg.mats);
    } else if(type.startsWith('md-')) {
      const parts=type.split('-');
      const mi=parseInt(parts[1]),st=parseInt(parts[2]);
      const mod=(op.md||[])[mi];
      if(mod) { const stg=mod.stages.find(s=>s.stage===st); if(stg) add(stg.mats); }
    }
  });
  return needs;
}

// ---- Blue equivalent ----
function toBlue(name, qty, depth) {
  if(depth>6) return {[name]:qty};
  const r = MAT_RARITY[name]??0;
  if(r<=2) return {[name]:qty};
  // Base chips (T3) and chip groups (T4, no recipe after cleanup) stay as-is
  // Only 双芯片 (T5) has a valid recipe and should be expanded
  if(name.includes('芯片') && !name.includes('双芯片')) return {[name]:qty};
  const recipe = RECIPES[name];
  if(!recipe||!recipe.length) return {[name]:qty};
  const res = {};
  recipe.forEach(ing => {
    const sub = toBlue(ing.name, ing.qty*qty, depth+1);
    for(const [m,q] of Object.entries(sub)) res[m]=(res[m]||0)+q;
  });
  return res;
}

// ---- Result display ----
const RAR_CLS2 = {2:'mat-blue',3:'mat-purple',4:'mat-gold'};
const RAR_LBL2 = {2:'蓝',3:'紫',4:'金'};
const CHIP_WORDS = ['芯片','双芯片'];
const isChip = n => CHIP_WORDS.some(w=>n.includes(w));

function calcResult() {
  const needs = calcNeeds();
  const inv = getInv();
  const showZero = document.getElementById('show-zero').checked;
  const hideChips = document.getElementById('hide-chips').checked;

  const rows = [];
  ALL_MATS.forEach(name => {
    if(hideChips&&isChip(name)) return;
    const needed=needs[name]||0;
    const have=inv[name]||0;
    const deficit=Math.max(0,needed-have);
    if(!showZero&&needed===0) return;
    rows.push({name,needed,have,deficit,r:MAT_RARITY[name]??0});
  });
  // Extra mats not in predefined list
  for(const [name,needed] of Object.entries(needs)) {
    if(ALL_MATS.includes(name)) continue;
    if(hideChips&&isChip(name)) continue;
    const have=inv[name]||0;
    const deficit=Math.max(0,needed-have);
    if(!showZero&&needed===0) continue;
    rows.push({name,needed,have,deficit,r:MAT_RARITY[name]??0});
  }
  rows.sort((a,b) => {
    if((a.deficit>0)!==(b.deficit>0)) return b.deficit-a.deficit;
    return b.deficit-a.deficit||b.needed-a.needed;
  });

  const totalChecked = document.querySelectorAll('#ops-list input[type=checkbox]:checked').length;
  const totalDef = rows.reduce((s,r)=>s+r.deficit,0);
  const defCount = rows.filter(r=>r.deficit>0).length;

  let totalExp = 0, totalLmd = 0;
  Object.entries(lvPlan).forEach(function(kv) {
    const opName=kv[0], plan=kv[1];
    const op = OPS[opName]; if(!op) return;
    const fe=plan.fe, fl=plan.fl, te=plan.te, tl=plan.tl;
    if(fe===te && fl>=tl) return;
    if(fe>te) return;
    const cost = calcLvCost(op.r, fe, fl, te, tl);
    totalExp += cost.exp; totalLmd += cost.lmd;
  });
  // Module upgrade LMD
  document.querySelectorAll('#ops-list input[type=checkbox]:checked').forEach(function(cb) {
    if(!cb.dataset.type.startsWith('md-')) return;
    const op = OPS[cb.dataset.op]; if(!op) return;
    const stage = parseInt(cb.dataset.type.split('-')[2]);
    const costs = MODULE_LMD[op.r];
    if(costs && stage>=1 && stage<=3) totalLmd += costs[stage-1];
  });
  const activeLvPlans = Object.values(lvPlan).filter(function(p){return p.te>p.fe||(p.te===p.fe&&p.tl>p.fl);}).length;

  let html = '<div class="stat-bar">'
    +'<span>升级计划 <b>'+activeLvPlans+'</b> 个干员</span>'
    +'<span>已勾选升级项 <b>'+totalChecked+'</b></span>'
    +'<span>有缺口 <b style="color:#f87171">'+defCount+'</b> 种</span>'
    +'<span>总缺口数量 <b style="color:#f87171">'+totalDef+'</b></span>'
    +(totalExp>0?'<span>需经验 <b style="color:#86efac">'+fmtNum(totalExp)+'</b></span>':'')
    +(totalLmd>0?'<span>需龙门币 <b style="color:#fcd34d">'+fmtNum(totalLmd)+'</b></span>':'')
    +'</div>';

  html += '<div class="result-wrap"><table class="result-table"><thead><tr>'
    +'<th>材料</th><th>品质</th><th style="text-align:right">需要</th><th style="text-align:right">拥有</th><th style="text-align:right">缺口</th>'
    +'</tr></thead><tbody>';
  rows.forEach(({name,needed,have,deficit,r}) => {
    const cls=RAR_CLS2[r]||'';
    const rl=RAR_LBL2[r]||'?';
    const defStr=deficit>0?'<span class="deficit">-'+deficit+'</span>':'<span class="ok">✓</span>';
    html+='<tr><td class="'+cls+'">'+name+'</td><td class="'+cls+'" style="text-align:center">'+rl+'</td>'
      +'<td style="text-align:right">'+needed+'</td><td style="text-align:right">'+have+'</td>'
      +'<td style="text-align:right">'+defStr+'</td></tr>';
  });
  html += '</tbody></table></div>';

  // Blue equivalent: total needs vs total supply (both converted to blue via recipes)
  // For non-synthesizable items (no recipe, e.g. 模组数据块), toBlue returns the item itself.
  // In Step 3, skip m===name when adding inventory to avoid double-counting those items.
  const blueNeeded = {};
  const blueAvail  = {};
  const invNow = getInv();

  // Step 1: convert ALL purple/gold total needs → blue (or themselves if non-synthesizable)
  rows.forEach(({name,needed,r}) => {
    if(r<3) return;
    const eq = toBlue(name, needed, 0);
    for(const [m,q] of Object.entries(eq)) blueNeeded[m]=(blueNeeded[m]||0)+q;
  });

  // Step 2: add direct blue material needs
  rows.forEach(({name,needed,r}) => {
    if(r>2) return;
    blueNeeded[name]=(blueNeeded[name]||0)+needed;
  });

  // Step 3: available = direct inventory, plus purple/gold inventory converted to blue
  // Skip m===name to avoid double-counting non-synthesizable items (they return themselves)
  Object.keys(blueNeeded).forEach(name => { blueAvail[name]=invNow[name]||0; });
  ALL_MATS.forEach(function(name) {
    const r=MAT_RARITY[name]??0;
    if(r<3) return;
    const have=invNow[name]||0;
    if(!have) return;
    const eq=toBlue(name,have,0);
    for(const [m,q] of Object.entries(eq)) {
      if(m===name) continue;
      if(blueAvail[m]!==undefined) blueAvail[m]=(blueAvail[m]||0)+q;
    }
  });

  if(Object.keys(blueNeeded).length) {
    html += '<div class="blue-eq-box"><h4>紫/金材料折算蓝色材料等效</h4>'
      +'<p style="font-size:11px;color:#6b7280;margin-bottom:8px">紫/金材料缺口折算为蓝色材料需求，与直接蓝材料需求合并后对比库存</p>'
      +'<div class="eq-grid">';
    Object.entries(blueNeeded).sort((a,b)=>b[1]-a[1]).forEach(([name,qty]) => {
      const r=MAT_RARITY[name]??0;
      const cls=RAR_CLS2[r]||'';
      const rl=RAR_LBL2[r]||'';
      const avail=Math.min(blueAvail[name]||0, qty);
      const still=Math.max(0,qty-avail);
      html+='<div class="eq-row"><span class="'+cls+'">'+name+(rl?' ['+rl+']':'')+'</span>'
        +'<span>需<b>'+qty+'</b> 库存可抵<b>'+avail+'</b> '
        +'<b style="color:'+(still>0?'#f87171':'#4ade80')+'">差'+still+'</b></span></div>';
    });
    html += '</div></div>';
  }

  document.getElementById('result-content').innerHTML = html;
}

// ---- Material source analysis ----
function calcSource(matName) {
  const box = document.getElementById('source-content');
  matName = matName.trim();
  if(!matName) { box.style.display='none'; return; }

  // How many of matName is embedded in qty units of mat (via RECIPES chain)
  function impliedQty(mat, qty) {
    if(mat === matName) return qty;
    var recipe = RECIPES[mat];
    if(!recipe||!recipe.length) return 0;
    var total = 0;
    recipe.forEach(function(ing){ total += impliedQty(ing.name, ing.qty*qty); });
    return total;
  }

  const rows = [];
  const indRows = []; // indirect: mat is an ingredient of something needed

  function addMats(opName, label, mats) {
    (mats||[]).forEach(function(m) {
      if(m.name===matName) {
        rows.push({opName:opName, label:label, qty:m.qty});
      } else {
        var impl = impliedQty(m.name, m.qty);
        if(impl>0) indRows.push({opName:opName, label:label, qty:impl, via:m.name});
      }
    });
  }

  // E1/E2 from level plan
  OPS_ORDER.forEach(function(opName) {
    const op = OPS[opName]; if(!op) return;
    const plan = lvPlan[opName]; if(!plan) return;
    const fe=plan.fe, te=plan.te;
    if(fe<=0 && te>=1) addMats(opName, 'E1精英化', op.e1);
    if(fe<=1 && te>=2) addMats(opName, 'E2精英化', op.e2);
  });
  document.querySelectorAll('#ops-list input[type=checkbox]:checked').forEach(function(cb) {
    const opName=cb.dataset.op, type=cb.dataset.type;
    const op=OPS[opName]; if(!op) return;
    if(type==='slv') {
      (op.sl||[]).forEach(function(s,i){ addMats(opName, '技能Lv'+(i+2), s.mats); });
    } else if(type.startsWith('ms-')) {
      const parts=type.split('-');
      const sk=parts[1], st=parseInt(parts[2]);
      const si=['s1','s2','s3'].indexOf(sk);
      const stg=(op.ms&&op.ms[sk]||[]).find(function(s){return s.stage===st;});
      if(stg) addMats(opName, 'S'+(si+1)+'专'+st, stg.mats);
    } else if(type.startsWith('md-')) {
      const parts=type.split('-');
      const mod=(op.md||[])[parseInt(parts[1])];
      if(mod){const stg=mod.stages.find(function(s){return s.stage===parseInt(parts[2]);});if(stg)addMats(opName,mod.name+'阶'+parts[2],stg.mats);}
    }
  });

  if(!rows.length && !indRows.length) {
    box.style.display='block';
    box.innerHTML='<span style="color:#6b7280">「'+matName+'」在已勾选项中无直接或间接消耗</span>';
    return;
  }

  const r = MAT_RARITY[matName]??0;
  const cls = {2:'mat-blue',3:'mat-purple',4:'mat-gold'}[r]||'';
  let html = '';

  if(rows.length) {
    rows.sort(function(a,b){return b.qty-a.qty;});
    const total = rows.reduce(function(s,x){return s+x.qty;},0);
    html += '<b class="'+cls+'">'+matName+'</b> 直接消耗合计 <b style="color:#e5e7eb">'+total+'</b>，共 '+rows.length+' 条升级项'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:3px;margin-top:6px">';
    rows.forEach(function(x){
      html+='<div style="display:flex;justify-content:space-between;padding:2px 6px;background:#283548;border-radius:3px">'
        +'<span>'+x.opName+' <span style="color:#6b7280">'+x.label+'</span></span>'
        +'<b style="color:#fbbf24">×'+x.qty+'</b></div>';
    });
    html+='</div>';
  }

  if(indRows.length) {
    indRows.sort(function(a,b){return b.qty-a.qty;});
    const indTotal = indRows.reduce(function(s,x){return s+x.qty;},0);
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #374151">'
      +'<b class="'+cls+'">'+matName+'</b> 通过上级材料间接消耗 <b style="color:#e5e7eb">'+indTotal+'</b>（折算量），共 '+indRows.length+' 条升级项'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:3px;margin-top:6px">';
    indRows.forEach(function(x){
      html+='<div style="display:flex;justify-content:space-between;padding:2px 6px;background:#1f2d3a;border-radius:3px">'
        +'<span>'+x.opName+' <span style="color:#6b7280">'+x.label+'</span>'
        +' <span style="color:#4b5563;font-size:10px">经'+x.via+'</span></span>'
        +'<b style="color:#fbbf24">×'+x.qty+'</b></div>';
    });
    html += '</div></div>';
  }

  box.style.display='block';
  box.innerHTML=html;
}

// ---- Plan persistence ----
function savePlan() {
  const checked = [];
  document.querySelectorAll('#ops-list input[type=checkbox]:checked').forEach(cb => {
    checked.push(cb.dataset.op + '|' + cb.dataset.type);
  });
  localStorage.setItem('ak_plan', JSON.stringify(checked));
  localStorage.setItem('ak_levels', JSON.stringify(lvPlan));
}

function loadPlan() {
  const saved = JSON.parse(localStorage.getItem('ak_plan') || '[]');
  if(saved.length) {
    const set = new Set(saved);
    document.querySelectorAll('#ops-list input[type=checkbox]').forEach(cb => {
      if(set.has(cb.dataset.op + '|' + cb.dataset.type)) cb.checked = true;
    });
  }
  const savedLv = JSON.parse(localStorage.getItem('ak_levels') || '{}');
  Object.keys(savedLv).forEach(opName => {
    const p = savedLv[opName];
    setLvPlan(opName, p.fe||0, p.fl||1, p.te||0, p.tl||1);
  });
}

// ---- Init ----
renderOps();
loadPlan();
renderInv();
document.getElementById('ops-list').addEventListener('change', savePlan);
</script>
